{% extends 'tienda/base.html' %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<div class="card shadow-sm">
  <div class="card-header bg-primary text-white"><h4 class="mb-0">Crear cuenta</h4></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for campo in form %}
        <div class="mb-3">
          <label class="form-label">{{ campo.label }}</label>{{ campo }}
          {% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary w-100">Registrarme</button>
    </form>
  </div>
</div>
{% endblock %}
